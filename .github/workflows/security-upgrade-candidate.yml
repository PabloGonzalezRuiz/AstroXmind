name: AST-003.5 · Validate security upgrade

on:
  push:
    branches: [security/ast-003-5-dependency-upgrade]
    paths:
      - package.json
      - .github/workflows/security-upgrade-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve lockfile for security upgrade
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Reproducible installation
        run: npm ci --no-audit --no-fund
      - name: Record resolved dependency tree
        run: npm ls --depth=0
      - name: Type and content validation
        run: npm run check
      - name: Static site build
        run: npm run build
      - name: Verify generated homepage
        run: test -f dist/index.html
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=low
      - name: Commit validated lockfile to security branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: lock validated Astro and Starlight dependency upgrades"
            git push origin HEAD:security/ast-003-5-dependency-upgrade
          fi
