name: Wiki · Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Astro wiki
        run: npm run build
      - name: Verify component-only wiki output
        run: |
          test -s dist/index.html
          test -s dist/clases-astro/index.html
          test -s dist/componentes/tree-table/index.html
          test -s dist/laboratorio-componentes/index.html
          test ! -e dist/tabulator/galeria.html
          test ! -e dist/markmap/constitucion-titulo-i.html
          test ! -d dist/bloque-1
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
