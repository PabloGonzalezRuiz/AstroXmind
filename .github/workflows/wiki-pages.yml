name: Wiki · Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install remark-directive for the semantic gallery
        run: npm install --no-save --package-lock=false remark-directive
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Build site
        run: npm run build
      - name: Diagnose generated site layout
        run: |
          echo 'Generated HTML files:'
          find dist -maxdepth 5 -name 'index.html' -print
          echo 'Top-level output:'
          ls -la dist
          test -f dist/index.html || (echo 'ERROR: dist/index.html missing; Pages root will return 404' && exit 1)
      - name: Verify Tabulator gallery is included in Pages artifact
        run: |
          test -s dist/tabulator/galeria.html || (echo 'ERROR: Tabulator gallery missing from dist/tabulator/galeria.html' && exit 1)
          grep -q 'Galería interactiva de Tabulator' dist/tabulator/galeria.html || (echo 'ERROR: unexpected Tabulator gallery content' && exit 1)
          echo 'OK: Tabulator gallery included in deployment artifact'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
