name: AST-003.5 · Index security candidate run

on:
  workflow_run:
    workflows:
      - AST-003.5 · Validate security upgrade
    types: [completed]

permissions:
  contents: write

concurrency:
  group: ast-003-5-security-candidate-index
  cancel-in-progress: false

jobs:
  record:
    if: github.event.workflow_run.head_branch == 'security/ast-003-5-dependency-upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/ci-run-index
          persist-credentials: true
      - name: Write candidate run reference
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          mkdir -p security
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = {
              "workflow": "AST-003.5 · Validate security upgrade",
              "branch": "security/ast-003-5-dependency-upgrade",
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "run_url": os.environ["RUN_URL"],
              "head_sha": os.environ["RUN_SHA"],
              "conclusion": os.environ["RUN_RESULT"],
          }
          Path("security/latest-run.json").write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          PY
      - name: Publish candidate index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/latest-run.json
          if ! git diff --cached --quiet; then
            git commit -m "security: index completed upgrade validation run"
            git pull --rebase origin automation/ci-run-index
            git push origin HEAD:automation/ci-run-index
          fi
