name: Wiki · Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Astro wiki
        run: npm run build
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-xmind-site
          path: dist/
      - name: Package local Windows wiki
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/package-local-wiki.mjs
      - name: Upload local Windows wiki
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AstroXmind-Wiki-Local
          path: packages/AstroXmind-Wiki-Local.zip
          if-no-files-found: error
