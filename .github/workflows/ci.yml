name: AstroXmind · CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: ${{ github.event_name == 'push' && 'write' || 'read' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require committed lockfile
        run: test -f package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type and content checks
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Verify generated entrypoint
        run: test -f dist/index.html
      - name: Publish discoverable run reference
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          JOB_RESULT: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git fetch origin automation/ci-run-index
          git worktree add --detach /tmp/astro-ci-run-index FETCH_HEAD
          cd /tmp/astro-ci-run-index
          mkdir -p ci
          printf '{"workflow":"AstroXmind CI","run_id":%s,"run_attempt":%s,"run_url":"https://github.com/%s/actions/runs/%s","head_sha":"%s","job_conclusion":"%s"}\n' "$RUN_ID" "$RUN_ATTEMPT" "$REPOSITORY" "$RUN_ID" "$RUN_SHA" "$JOB_RESULT" > ci/latest-run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/latest-run.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: record run $RUN_ID ($JOB_RESULT)"
            git push origin HEAD:automation/ci-run-index
          fi
