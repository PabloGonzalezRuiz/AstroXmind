name: AST-003.5 · Dependency and license audit

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - examples/astro-component-lab/package.json
      - examples/astro-component-lab/package-lock.json
      - scripts/audit_dependencies.py
      - .github/workflows/dependency-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.scope }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: wiki
            directory: .
            artifact: ast-003-5-dependency-audit
          - scope: component-lab
            directory: examples/astro-component-lab
            artifact: ast-003-5-component-lab-audit
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Collect npm advisory report
        shell: bash
        run: |
          mkdir -p audit-results
          npm audit --json > audit-results/npm-audit.json || code=$?
          echo "npm audit exit code: ${code:-0}"
          test -s audit-results/npm-audit.json
      - name: Summarize advisories and licenses
        run: python3 "$GITHUB_WORKSPACE/scripts/audit_dependencies.py"
      - name: Publish audit summary
        if: always()
        run: |
          if test -f audit-results/report.md; then
            cat audit-results/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Audit report not generated; inspect logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.directory }}/audit-results/
          if-no-files-found: warn
